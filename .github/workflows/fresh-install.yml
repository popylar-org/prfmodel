name: Test fresh install

# Installs prfmodel the way users do, with pip and without uv.lock, and runs the unit tests against whatever
# dependency versions that resolves to today. The other workflows install the locked versions, so they don't notice
# when a new release of a dependency breaks prfmodel.
#
# It runs weekly and on demand rather than on pull requests, so a new dependency release fails this workflow and not
# an unrelated pull request. Run it manually before a release or a workshop.
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test fresh install (${{ matrix.backend }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination: one failing must not mask the others.
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        backend: ['tensorflow', 'torch', 'jax']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install prfmodel and test dependencies with pip
        run: python -m pip install ".[${{ matrix.backend }}]" pytest "pytest-regressions[dataframe,num]"
      # A failure is easier to trace when the log shows which versions were resolved
      - name: List installed versions
        run: python -m pip list
      - name: Run unit tests
        run: python -m pytest -v
        env:
          KERAS_BACKEND: ${{ matrix.backend }}
          JAX_ENABLE_X64: "true"
