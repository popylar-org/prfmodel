name: Publish to PyPI

# Publishes the package to PyPI when a GitHub release is published, and to TestPyPI when run manually from the
# Actions tab. A manual run is a dry run of the release: it builds and checks the package from the selected branch
# exactly as a release would, but uploads it to TestPyPI instead.
#
# The release tag must be the package version with a leading 'v' (e.g., 'v0.1.0' for version '0.1.0'), so a
# release cannot publish a version that differs from the one in pyproject.toml.
#
# Uploads use PyPI trusted publishing, so no API token is stored in the repository. This requires a one-time
# setup on PyPI and TestPyPI and two GitHub environments ('pypi' and 'testpypi'); see README.dev.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.13'
          extras: publishing
      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "::error::Release tag '${TAG}' does not match the package version '${VERSION}' (expected 'v${VERSION}')"
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check --strict dist/*
      # Installs the wheel into a fresh environment, outside of the repository, so that the check fails when the
      # wheel is missing modules or package data that a source checkout would have provided. JAX is the smallest
      # backend to install.
      - name: Smoke test the wheel
        env:
          KERAS_BACKEND: jax
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          WHEEL="$(pwd)/$(ls dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv --python 3.13 smoke-test
          uv pip install --python smoke-test/bin/python "prfmodel[jax] @ file://${WHEEL}"
          smoke-test/bin/python - "$VERSION" <<'EOF'
          import sys
          import pandas as pd
          import prfmodel
          from prfmodel.examples import load_2d_prf_bar_stimulus
          from prfmodel.models.prf import Gaussian2DPRFModel

          expected_version = sys.argv[1]
          if prfmodel.__version__ != expected_version:
              sys.exit(f"prfmodel.__version__ is {prfmodel.__version__} but the package version is {expected_version}")

          # The bundled stimulus is package data, so loading it fails if the wheel was built without it
          stimulus = load_2d_prf_bar_stimulus()
          params = pd.DataFrame(
              {"mu_x": [0.0], "mu_y": [1.0], "sigma": [1.0], "weight_deriv": [0.0], "baseline": [0.0], "amplitude": [1.0]},
          )
          response = Gaussian2DPRFModel()(stimulus, params)
          print(f"prfmodel {prfmodel.__version__}: predicted response with shape {response.shape}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prfmodel/${{ needs.build.outputs.version }}/
    permissions:
      # Required for trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/prfmodel/${{ needs.build.outputs.version }}/
    permissions:
      # Required for trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI, like PyPI, never accepts the same version twice. Skipping it lets a dry run be repeated
          # for the same version, at the cost of not uploading the rebuilt files.
          skip-existing: true
