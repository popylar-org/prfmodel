name: Set up Python with uv
description: Set up Python and uv, cache uv packages, and install dependencies from uv.lock

inputs:
  python-version:
    description: Python version to install
    required: true
  extras:
    description: Comma-separated extras to install (e.g. "dev,tensorflow")
    required: true

runs:
  using: composite
  steps:
    - name: Set up uv and Python ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ inputs.python-version }}
        # Create .venv and add it to PATH so later steps can call python, pytest, ruff, etc. directly
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-suffix: ${{ inputs.extras }}
    - name: Python info
      shell: bash -e {0}
      run: |
        which python
        python --version
    - name: Install dependencies from uv.lock
      shell: bash
      run: |
        EXTRA_ARGS=$(echo "${{ inputs.extras }}" | tr ',' '\n' | sed '/^$/d; s/^/--extra /' | tr '\n' ' ')
        uv sync --locked $EXTRA_ARGS
